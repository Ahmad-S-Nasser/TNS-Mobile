name: tips_n_steps
description: A new Flutter project for TipsNSteps.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^8.1.3
  get_it: ^7.6.4
  flutter_svg: ^2.0.7
  flutter_screenutil: ^5.9.0
  equatable: ^2.0.5
  flutter_animate: ^4.5.1
  shimmer: ^3.0.0
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.0.3
  url_launcher: ^6.2.0
  share_plus: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/cairo/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-Black.ttf
          weight: 900
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/cairo/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
          weight: 400
